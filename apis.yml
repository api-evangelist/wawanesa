name: Wawanesa Insurance
kind: company
description: >-
  The Wawanesa Mutual Insurance Company, founded in 1896 in Wawanesa, Manitoba
  and headquartered in Winnipeg, is one of Canada's largest property and
  casualty mutual insurers, writing auto, home, condo, tenant, seasonal
  residence, farm and commercial lines across every province and territory
  through a 100% independent broker distribution model, alongside its
  wholly-owned life and group subsidiary Wawanesa Life. Wawanesa runs its
  policy, claims and billing on Guidewire InsuranceSuite following a roughly
  $300 million Strategic Systems Renewal that made it one of the first Canadian
  insurers to put its entire product suite online, and it has announced a
  broker-facing API programme — most notably a Commercial Small Business API
  aligned to CSIO data standards that supports real-time rating, quoting and
  binding — plus CSIO My Proof of Insurance electronic pink slips. None of that
  surface is public: Wawanesa publishes no developer portal, no API reference,
  no OpenAPI, and no self-serve signup. Probes of developer./developers./docs.
  wawanesa.com do not resolve, api.wawanesa.com answers 403 at the root, and the
  only integration path is the Salesforce-based Broker Platform behind an Okta
  login with onboarding brokered by a Wawanesa Business Development
  representative. Canada has no open-insurance mandate — Consumer-Driven Banking
  excludes insurance outright — so the connectivity layer here is CSIO, not
  ACORD, and the honest posture is partner-gated with no public API. What
  Wawanesa does publish is certification: it holds CSIO's API Security Standards
  Certification (2024-10-29), was the first CSIO member certified in JSON API
  Standards for Billing (2025-02-05), was the first insurer to attain Claims
  eDocs Certification (2022-04-04), and contributed nine reusable API packages —
  Quote, New Business, Policy Inquiry, Policy Update List, Policy Cancellation,
  Risk Appetite, Required Fields, Billing Inquiry and eDocs — to CSIO's
  Reusable Services Library for other carriers and BMS vendors to implement.
