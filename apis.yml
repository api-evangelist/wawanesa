apis:
- aid: wawanesa:wawanesa-commercial-small-business-api
  name: Wawanesa Commercial Small Business API
  description: >-
    Broker-facing commercial small business API announced by Wawanesa on
    2022-03-30, built with HUB International and described by Wawanesa as
    "fully aligned with CSIO data standards". Per the company announcement it
    lets brokers connect their information systems to Wawanesa for real-time
    risk rating, quoting and binding, with tailored packages for Business &
    Professional Services, Retail Services and Contractors. There is no public
    developer portal, no published API reference, no OpenAPI definition and no
    documented base URL; the announcement directs brokers to "contact their
    Wawanesa Business Development representative" to integrate. Listed here
    because Wawanesa attests to it in a first-party press release, and recorded
    honestly as partner-gated and undocumented.
  humanURL: https://www.wawanesa.com/canada/news/wawanesa-improves-insurance-quotes-for-small-businesses
