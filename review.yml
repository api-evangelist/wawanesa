    type: Website
    status: 200
    note: Wawanesa Canada homepage; links to Broker Platform login and Find a Broker.
  - url: https://www.wawanesa.com/canada/news/wawanesa-improves-insurance-quotes-for-small-businesses
    type: News
    status: 200
    note: Commercial Small Business API announcement (2022-03-30) — CSIO-aligned,
      quote + bind, broker onboarding via Business Development rep.
  - url: https://www.wawanesa.com/canada/news/wawanesa-furthers-commitment-to-brokers-with-new-broker-platform
    type: News
    status: 200
    note: Broker Platform launch (2022-03-28); "adopted numerous APIs"; IBAC D/X.
  - url: https://www.wawanesa.com/canada/news/wawanesa-implements-CSIO-MPOI
