actions:
  apisYmlCreated: true
  apisListed: 1
  openapiDirectoryCreated: false
  reason: |
    One apis[] entry is recorded — the Commercial Small Business API — because
    Wawanesa attests to it in a first-party press release naming its capability
    (rating, quote, bind) and its standard (CSIO). It is listed with the
    announcement as its only Documentation property, no baseURL and no
    APIReference, because none is published. No OpenAPI was harvested and the
    openapi/ directory is deliberately omitted. Nothing was synthesized.
