method: searched
source: live probes of every Wawanesa host in apis.yml (2026-07-25)
note: >-
  Wawanesa publishes no /.well-known/ surface on its public web or API hosts.
  www.wawanesa.com answers 200 for every /.well-known/* path but serves the
  site's catch-all HTML shell (a soft 404), so none of those responses are real
  documents. api.wawanesa.com answers 403 (nginx) for every path including
  /.well-known/*. The only genuine discovery documents on any Wawanesa host are
  the identity-provider metadata for the gated Broker Platform: an Okta
  OpenID Connect / OAuth 2.0 authorization-server document at
  login.brokerplatform.wawanesa.com and a Salesforce Experience Cloud OpenID
  Connect document at brokerplatform.wawanesa.com. Both were fetched
  anonymously and are saved verbatim. They describe how brokers log in; neither
  describes a Wawanesa insurance API.
hosts:
