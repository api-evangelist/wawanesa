source: >-
  live anonymous fetch of the OAuth 2.0 / OpenID Connect discovery documents on
  the Wawanesa Broker Platform hosts (2026-07-25)
docs: null
note: >-
  Wawanesa publishes no OpenAPI and no scope/permission reference, so there is
  no insurance-business scope vocabulary to harvest. Every scope below was read
  verbatim from the `scopes_supported` array of a live discovery document on a
  Wawanesa host. They are STOCK IDENTITY-PLATFORM scopes — standard OIDC claims
  scopes on the Okta broker issuer, Okta org-management scopes on the Okta org
  authorization server, and stock Salesforce Experience Cloud platform scopes on
  the Broker Platform. None of them grants access to a quote, bind, policy,
  billing or claims capability; they govern broker sign-in and the vendor
  platforms underneath it. Recorded here so the gap is explicit rather than
  implied. Wawanesa's real API authorization model is defined by CSIO's API
  Security Standards (certified 2024-10-29), which is member-gated and does not
  publish its scope vocabulary publicly.
schemes:
- name: BrokerPlatformOkta
  source: well-known/wawanesa-brokerplatform-login-openid-configuration.json
  kind: openid-connect
  flows:
  - flow: authorizationCode
    authorizationUrl: https://login.brokerplatform.wawanesa.com/oauth2/v1/authorize
    tokenUrl: https://login.brokerplatform.wawanesa.com/oauth2/v1/token
- name: BrokerPlatformOktaOrgAuthorizationServer
  source: well-known/wawanesa-brokerplatform-login-oauth-authorization-server.json
  kind: oauth2
  flows:
  - flow: clientCredentials
    tokenUrl: https://login.brokerplatform.wawanesa.com/oauth2/v1/token
  - flow: authorizationCode
    authorizationUrl: https://login.brokerplatform.wawanesa.com/oauth2/v1/authorize
    tokenUrl: https://login.brokerplatform.wawanesa.com/oauth2/v1/token
- name: BrokerPlatformSalesforce
  source: well-known/wawanesa-brokerplatform-openid-configuration.json
  kind: openid-connect
  flows:
  - flow: authorizationCode
    authorizationUrl: https://brokerplatform.wawanesa.com/services/oauth2/authorize
    tokenUrl: https://brokerplatform.wawanesa.com/services/oauth2/token
